[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
version = "0.2.2"
name = "aiida-chemshell"
description = "AiiDA workflow plugin for the ChemShell chemical modelling software package"
authors = [
    { name = "Dr. Benjamin T. Speake", email = "benjamin.speake@stfc.ac.uk" },
]
dependencies = ["aiida-core >= 2.5"]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["aiida", "workflows", "chemshell"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Framework :: AiiDA",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/stfc/aiida-chemshell"

[project.entry-points."aiida.calculations"]
"chemshell" = "aiida_chemshell.calculations.base:ChemShellCalculation"


[project.entry-points."aiida.parsers"]
"chemshell" = "aiida_chemshell.parsers.base:ChemShellParser"


[project.entry-points."aiida.workflows"]
"chemshell.opt" = "aiida_chemshell.workflows.optimisation:GeometryOptimisationWorkChain"
"chemshell.atomic_energies" = "aiida_chemshell.workflows.isolated_atoms:IsolatedAtomicEnergiesWorkChain"
"chemshell.batch" = "aiida_chemshell.workflows.batch_calculation:BatchProcessWorkChain"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "aiida-core>=2.8",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "ruff>=0.11.0",
    "pre-commit",
]
docs = ["sphinx>=8.0.2", "piccolo-theme>=0.14.0", "sphinx-toolbox", "numpydoc"]

[tool.pytest.ini_options]
filterwarnings = [
    # Third-party warnings we cannot act on and that only add noise:
    # plumpy still calls the deprecated asyncio.get_event_loop().
    "ignore:There is no current event loop:DeprecationWarning",
    # AiiDA's SQLAlchemy storage backend emits autoflush session warnings.
    "ignore::sqlalchemy.exc.SAWarning",
    # AiiDA reports creating its config folder inside the temp test profile.
    "ignore:Creating AiiDA configuration folder:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
exclude = ["conf.py"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["B008"]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pylint
    "C",
    "R",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    "FA",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
]
ignore = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 10
